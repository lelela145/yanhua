<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烟花效果</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
            cursor: pointer;
        }
        canvas {
            display: block;
        }
        .text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            z-index: 1;
        }
        .hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            text-align: center;
            z-index: 1;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="text" id="displayText">点击屏幕观看烟花</div>
    <div class="hint">点击屏幕任意位置触发烟花</div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const displayText = document.getElementById('displayText');
        
        // 设置画布大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // 颜色列表
        const colors = ['#FF0000', '#FFA500', '#FFFF00', '#00FF00', '#0000FF', '#800080', '#FFC0CB', '#FFFFFF'];
        
        // 烟花粒子类
        class Firework {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.particles = [];
                this.hue = colors[Math.floor(Math.random() * colors.length)];
                this.done = false;
                
                // 创建粒子
                for (let i = 0; i < 100; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 3 + 1;
                    const radius = Math.random() * 2 + 1;
                    
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        radius: radius,
                        color: this.hue,
                        alpha: 1,
                        decay: Math.random() * 0.02 + 0.01
                    });
                }
            }
            
            update() {
                if (this.done) return;
                
                this.particles.forEach(particle => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.vy += 0.1; // 重力
                    particle.alpha -= particle.decay;
                    
                    if (particle.alpha <= 0) {
                        particle.alpha = 0;
                    }
                });
                
                // 检查是否所有粒子都消失
                this.done = this.particles.every(particle => particle.alpha === 0);
            }
            
            draw() {
                if (this.done) return;
                
                this.particles.forEach(particle => {
                    ctx.save();
                    ctx.globalAlpha = particle.alpha;
                    ctx.fillStyle = particle.color;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            }
        }
        
        // 上升的烟花
        class Rocket {
            constructor(x) {
                this.x = x;
                this.y = canvas.height;
                this.speed = Math.random() * 3 + 5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.done = false;
            }
            
            update() {
                if (this.done) return;
                
                this.y -= this.speed;
                
                // 当到达一定高度时爆炸
                if (this.y < canvas.height * 0.3 + Math.random() * canvas.height * 0.4) {
                    this.done = true;
                    return new Firework(this.x, this.y);
                }
                
                return null;
            }
            
            draw() {
                if (this.done) return;
                
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        // 存储烟花和火箭
        const fireworks = [];
        const rockets = [];
        
        // 动画循环
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 更新和绘制火箭
            for (let i = rockets.length - 1; i >= 0; i--) {
                const rocket = rockets[i];
                const firework = rocket.update();
                rocket.draw();
                
                if (rocket.done) {
                    rockets.splice(i, 1);
                    if (firework) {
                        fireworks.push(firework);
                    }
                }
            }
            
            // 更新和绘制烟花
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const firework = fireworks[i];
                firework.update();
                firework.draw();
                
                if (firework.done) {
                    fireworks.splice(i, 1);
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        // 点击事件
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // 显示文字
            displayText.textContent = '诡秘看我新学会的小东西';
            displayText.style.top = `${y - 50}px`;
            displayText.style.left = `${x}px`;
            displayText.style.transform = 'translateX(-50%)';
            
            // 创建火箭
            rockets.push(new Rocket(x));
            
            // 3秒后清除文字
            setTimeout(() => {
                displayText.textContent = '点击屏幕观看烟花';
                displayText.style.top = '50%';
                displayText.style.left = '50%';
                displayText.style.transform = 'translate(-50%, -50%)';
            }, 3000);
        });
        
        // 开始动画
        animate();
    </script>
</body>
</html>
